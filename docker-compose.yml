services:
  mongo:
    image: mongo:7
    container_name: tudex-live-chat-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: tudex-live-chat-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-3005}:3005"
    environment:
      PORT: 3005
      APP_NAME: ${APP_NAME:-Tudex Social}
      MONGODB_URI: mongodb://mongo:27017/tudex_social
      OIDC_ENABLED: ${OIDC_ENABLED:-true}
      OIDC_ISSUER: ${OIDC_ISSUER:-https://passport.tudexnetworks.com}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-710e8b14-d605-4a21-83d4-86ed0e002811}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-ArhyOPh1ZCBlvZl6QJukl42emPA7sIK5}
      OIDC_AUTHORIZE_URL: ${OIDC_AUTHORIZE_URL:-https://passport.tudexnetworks.com/authorize}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-https://passport.tudexnetworks.com/api/oidc/token}
      OIDC_USERINFO_URL: ${OIDC_USERINFO_URL:-https://passport.tudexnetworks.com/api/oidc/userinfo}
      OIDC_END_SESSION_URL: ${OIDC_END_SESSION_URL:-https://passport.tudexnetworks.com/api/oidc/end-session}
      API_KEY: ${API_KEY:-}
      CHATS_CACHE_TTL_MS: ${CHATS_CACHE_TTL_MS:-5000}
      MESSAGES_CACHE_TTL_MS: ${MESSAGES_CACHE_TTL_MS:-5000}
      AVATAR_TTL_MS: ${AVATAR_TTL_MS:-600000}
      AVATAR_FETCH_LIMIT: ${AVATAR_FETCH_LIMIT:-40}
      AVATAR_FETCH_TIMEOUT_MS: ${AVATAR_FETCH_TIMEOUT_MS:-7000}
      DEFAULT_ACCOUNT_ID: ${DEFAULT_ACCOUNT_ID:-default}
      CHROME_EXECUTABLE_PATH: ${CHROME_EXECUTABLE_PATH:-/usr/bin/chromium}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - whatsapp_auth:/app/.wwebjs_auth
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H \"X-API-Key: $${API_KEY:-}\" http://localhost:3005/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_NAME: ${APP_NAME:-Tudex Social}
    container_name: tudex-live-chat-frontend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:4173"

volumes:
  mongo_data:
  whatsapp_auth:
